<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RigZora - Extreme Gaming Hardware & RAM Store</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        rzDark: '#080C14',
                        rzCard: '#0F172A',
                        rzBorder: '#1E293B',
                        rzCyan: '#00F2FE',
                        rzPurple: '#8B5CF6',
                        rzNeon: '#10B981',
                        rzAccent: '#F59E0B'
                    },
                    fontFamily: {
                        sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
                        mono: ['JetBrains Mono', 'Fira Code', 'monospace']
                    }
                }
            }
        }
    </script>

    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #080C14;
            color: #F8FAFC;
        }
        /* Glowing neon borders & elements */
        .neon-glow-cyan {
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.25);
        }
        .neon-glow-purple {
            box-shadow: 0 0 20px rgba(139, 92, 246, 0.25);
        }
        .neon-border {
            border-color: rgba(0, 242, 254, 0.4);
        }
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #080C14;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1E293B;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #00F2FE;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col justify-between custom-scrollbar selection:bg-rzCyan selection:text-black">

    <!-- ANNOUNCEMENT BAR -->
    <div class="bg-gradient-to-r from-rzDark via-slate-900 to-rzDark border-b border-rzBorder text-slate-300 text-xs py-1.5 px-4">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2 font-medium">
            <div class="flex items-center space-x-3">
                <span class="flex items-center gap-1.5 text-rzCyan font-bold">
                    <i class="fa-solid fa-bolt animate-pulse"></i> RIGZORA OVERCLOCK SALE LIVE
                </span>
                <span class="hidden md:inline text-slate-500">|</span>
                <span class="hidden md:inline text-slate-400">100% Guaranteed Genuine Hardware with Manufacturer Warranty</span>
            </div>
            <div class="flex items-center space-x-4 text-[11px]">
                <button onclick="openReturnModal()" class="hover:text-rzCyan transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-rotate-left text-rzAccent"></i> 7-Day Returns
                </button>
                <span>|</span>
                <button onclick="openTrackingModal()" class="hover:text-rzCyan transition-colors flex items-center gap-1">
                    <i class="fa-solid fa-location-crosshairs text-rzCyan"></i> Live Order Tracker
                </button>
            </div>
        </div>
    </div>

    <!-- MAIN APP NAVBAR -->
    <header class="bg-rzDark/90 backdrop-blur-md sticky top-0 z-40 border-b border-rzBorder">
        <div class="max-w-7xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
            
            <!-- Brand Logo -->
            <a href="#" onclick="filterCategory('all'); return false;" class="flex items-center gap-2 group">
                <div class="w-10 h-10 rounded-lg bg-gradient-to-tr from-rzCyan to-rzPurple p-0.5 shadow-lg group-hover:neon-glow-cyan transition-all">
                    <div class="w-full h-full bg-rzDark rounded-[7px] flex items-center justify-center">
                        <i class="fa-solid fa-microchip text-rzCyan text-xl group-hover:scale-110 transition-transform"></i>
                    </div>
                </div>
                <div class="flex flex-col">
                    <span class="text-2xl font-black tracking-wider bg-gradient-to-r from-white via-slate-200 to-rzCyan bg-clip-text text-transparent">
                        RIGZORA
                    </span>
                    <span class="text-[9px] font-mono tracking-widest text-rzCyan uppercase">Extreme Hardware Store</span>
                </div>
            </a>

            <!-- Search Bar -->
            <div class="flex-1 max-w-xl relative hidden md:block">
                <div class="relative">
                    <input type="text" id="searchInput" oninput="handleSearch()" placeholder="Search DDR5 RAM, RTX 4090, i9 CPUs, Gen5 SSDs..." 
                        class="w-full bg-rzCard/80 border border-rzBorder text-slate-200 text-xs px-4 py-2.5 pl-10 rounded-lg focus:outline-none focus:border-rzCyan focus:ring-1 focus:ring-rzCyan transition-all placeholder:text-slate-500">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3 text-slate-500 text-xs"></i>
                </div>
            </div>

            <!-- Action Controls -->
            <div class="flex items-center space-x-3 text-xs font-semibold">
                <button onclick="window.open('https://docs.google.com/forms/d/e/1FAIpQLSfhljrwvvtt6N1QQ1Nbugscnat5-mt_wcXOWYeHUWHtBq4QUg/viewform?usp=header', '_blank')" class="hidden sm:flex items-center space-x-1.5 bg-rzCard border border-rzCyan/50 hover:border-rzCyan px-3.5 py-2 rounded-lg text-rzCyan hover:text-white transition-all shadow-md">
                    <i class="fa-solid fa-paper-plane"></i>
                    <span>Order Form</span>
                </button>

                <!-- Cart Launcher -->
                <button onclick="toggleCartDrawer()" class="relative flex items-center space-x-2 bg-gradient-to-r from-rzCyan to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 font-extrabold px-4 py-2 rounded-lg shadow-md transition-all neon-glow-cyan">
                    <i class="fa-solid fa-cart-shopping text-sm"></i>
                    <span class="hidden sm:inline">CART</span>
                    <span id="cartCountBadge" class
