<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rigzora – PC Parts Store</title>
<style>
:root{--bg:#0a0d14;--card:#121826;--line:#212b40;--tx:#e8eefc;--mut:#8b97b3;--neon:#00e5ff;--pink:#ff2bd6;--ok:#22c55e;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
button,input,select{font:inherit;color:inherit}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:#0a0d14ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:center;padding:10px 14px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a0d14;z-index:6}
.logo{font-weight:800;font-size:22px;letter-spacing:1px;color:var(--neon);text-shadow:0 0 12px #00e5ff88}.logo b{color:var(--pink);text-shadow:0 0 12px #ff2bd688}
.search{flex:1;min-width:160px;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;outline:none}
.search:focus{border-color:var(--neon)}
.btn{background:linear-gradient(90deg,var(--neon),#5b8cff);color:#001018;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--line)}
.btn:disabled{opacity:.5}
.banner{margin:14px;padding:22px;border-radius:14px;background:linear-gradient(120deg,#0b2a3a,#2a0b3a);border:1px solid var(--line)}
.banner h1{margin:0 0 6px;font-size:24px}.banner p{margin:0;color:var(--mut)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:0 14px 6px}
.chip{white-space:nowrap;background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--mut)}
.chip.on{border-color:var(--neon);color:var(--neon);box-shadow:0 0 10px #00e5ff33}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
.card:hover{border-color:#00e5ff66}
.img{height:120px;display:grid;place-items:center;font-size:52px;position:relative}
.img svg{width:92%;height:100%}.img i{position:absolute;left:8px;top:8px;font:700 10px system-ui;background:#000a;padding:2px 7px;border-radius:99px;color:var(--neon);font-style:normal}
.img em{position:absolute;right:8px;top:8px;font:700 10px system-ui;background:var(--pink);padding:2px 7px;border-radius:99px;font-style:normal;color:#fff}
.info{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.nm{font-size:13px;line-height:1.3;min-height:34px}.br{color:var(--mut);font-size:11px}
.rt{font-size:12px;color:#fbbf24}.rt span{color:var(--mut)}
.pr{font-size:18px;font-weight:800}.pr s{font-size:12px;color:var(--mut);font-weight:400;margin-left:4px}
.card .btn{margin-top:auto;width:100%}
.ov{position:fixed;inset:0;background:#000b;z-index:20;display:none;justify-content:flex-end}
.ov.show{display:flex}
.panel{background:var(--bg);width:min(460px,100%);height:100%;overflow:auto;padding:16px;border-left:1px solid var(--line);padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel h2{margin:0 0 12px}.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.q{display:flex;align-items:center;gap:6px}.q button{width:26px;height:26px;border-radius:6px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.tot{display:flex;justify-content:space-between;padding:6px 0;color:var(--mut)}.tot.g{color:var(--tx);font-weight:800;font-size:18px}
label{display:block;font-size:12px;color:var(--mut);margin:10px 0 4px}
.in{width:100%;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:10px;outline:none}.in:focus{border-color:var(--neon)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.steps{display:flex;gap:6px;margin-bottom:14px}.steps div{flex:1;height:4px;border-radius:4px;background:var(--line)}.steps .d{background:var(--neon)}
.pay{display:flex;gap:8px;margin:8px 0}.pay button{flex:1;padding:9px 4px;border-radius:8px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-size:13px}.pay button.on{border-color:var(--neon);color:var(--neon)}
.err{color:#ff6b6b;font-size:12px;min-height:16px;margin-top:6px}
.note{font-size:12px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px;margin-top:10px}
.tick{width:96px;height:96px;margin:20px auto 10px;display:block}
.tick circle{fill:none;stroke:var(--ok);stroke-width:5;stroke-dasharray:290;stroke-dashoffset:290;animation:d .7s forwards}
.tick path{fill:none;stroke:var(--ok);stroke-width:6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:60;stroke-dashoffset:60;animation:d .5s .6s forwards}
@keyframes d{to{stroke-dashoffset:0}}
.ctr{text-align:center}
footer{padding:24px 14px;color:var(--mut);text-align:center;font-size:12px;border-top:1px solid var(--line)}
.trust{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin:6px 14px;color:var(--mut);font-size:12px}
</style></head><body>
<header>
<div class="logo">RIG<b>ZORA</b></div>
<input class="search" id="q" placeholder="Search RAM, SSD, GPU, CPU…">
<button class="btn ghost" id="acct" onclick="openAuth()">Sign in</button>
<button class="btn" onclick="openCart()">🛒 Cart (<span id="cc">0</span>)</button>
</header>
<div class="banner"><h1>Build your dream rig with Rigzora</h1><p>Genuine PC parts · 100% secure online payment · Easy 7-day returns</p></div>
<div class="trust"><span>🔒 Online payment only</span><span>🚚 Free delivery above $25</span><span>↩️ 7-day return</span><span>✅ Brand warranty</span></div>
<div class="chips" id="chips" style="margin-top:10px"></div>
<div class="grid" id="grid"></div>
<footer>© 2026 Rigzora. All prices in USD. Payments are accepted online only — no Cash on Delivery.</footer>

<div class="ov" id="ov" onclick="if(event.target===this)closeOv()"><div class="panel" id="panel"></div></div>

<script>
var D="RAM|Corsair|Vengeance LPX 16GB (2x8GB) DDR4 3200MHz|3499|4299|4.6|2814\nRAM|G.Skill|Trident Z5 RGB 32GB (2x16GB) DDR5 6000MHz|10999|13499|4.7|1203\nRAM|Kingston|FURY Beast 16GB DDR5 5600MHz|5299|6499|4.5|1766\nRAM|Crucial|8GB DDR4 3200MHz Desktop Memory|1799|2299|4.4|5120\nRAM|TeamGroup|T-Force Delta RGB 16GB DDR4 3600MHz|4199|5199|4.5|932\nStorage|Samsung|980 PRO 1TB NVMe PCIe 4.0 SSD|9499|12999|4.8|4410\nStorage|WD|Black SN850X 1TB NVMe Gen4 SSD|8999|11999|4.7|2380\nStorage|Crucial|P3 500GB NVMe PCIe 3.0 SSD|3299|4499|4.4|6021\nStorage|Kingston|NV2 1TB NVMe SSD|5499|6999|4.3|3340\nStorage|Seagate|Barracuda 2TB 7200RPM HDD|4899|5799|4.5|7250\nGPU|NVIDIA|GeForce RTX 4060 8GB GDDR6 Dual Fan|29999|34999|4.6|1520\nGPU|AMD|Radeon RX 7600 8GB GDDR6|24499|28999|4.4|880\nGPU|NVIDIA|GeForce RTX 4070 SUPER 12GB GDDR6X|59999|66999|4.8|640\nCPU|AMD|Ryzen 5 5600 6-Core 12-Thread (AM4)|9499|12499|4.7|3902\nCPU|AMD|Ryzen 7 7700X 8-Core 16-Thread (AM5)|29999|34999|4.7|710\nCPU|Intel|Core i5-13400F 10-Core Processor|16999|20999|4.5|2210\nCPU|Intel|Core i7-14700K 20-Core Unlocked|39999|44999|4.6|540\nMotherboard|ASUS|TUF Gaming B550-PLUS WiFi II (AM4)|10999|13999|4.5|1380\nMotherboard|MSI|MAG B760 TOMAHAWK WiFi DDR5|17499|20999|4.6|760\nMotherboard|Gigabyte|B650 AORUS ELITE AX (AM5)|15999|18999|4.5|690\nPSU|Corsair|CV650 650W 80+ Bronze|4799|5999|4.5|2980\nPSU|Cooler Master|MWE 750W 80+ Gold Fully Modular|7999|9999|4.6|1120\nCooling|Cooler Master|Hyper 212 Black Edition CPU Air Cooler|2999|3699|4.5|4100\nCooling|DeepCool|AK620 Dual-Tower CPU Cooler|4999|6299|4.7|1530\nCooling|NZXT|Kraken 240 AIO Liquid Cooler|11999|14999|4.5|480\nCabinet|NZXT|H5 Flow ATX Mid-Tower Case|7999|9499|4.7|910\nCabinet|Ant Esports|ICE-120 ARGB Mid-Tower Cabinet|3999|5499|4.2|2740\nPeripherals|Logitech|G102 Lightsync Gaming Mouse|1299|1995|4.5|18200\nPeripherals|Redragon|K552 Kumara Mechanical Keyboard|2799|3999|4.4|9810\nPeripherals|LG|24GN600 24\" 144Hz IPS Gaming Monitor|10999|14999|4.5|2030".split("\n").map(function(l,i){var p=l.split("|");return{id:i,c:p[0],b:p[1],n:p[2],p:U(+p[3]),m:U(+p[4]),r:p[5],v:+p[6]}});
var ICON={RAM:"🧠",Storage:"💾",GPU:"🎮",CPU:"⚙️",Motherboard:"🔌",PSU:"🔋",Cooling:"❄️",Cabinet:"🖥️",Peripherals:"🖱️"};
var HUE={RAM:190,Storage:260,GPU:320,CPU:20,Motherboard:140,PSU:50,Cooling:200,Cabinet:280,Peripherals:340};
var B={RAM:'<rect x="8" y="22" width="104" height="30" rx="3" fill="@d"/><rect x="16" y="27" width="14" height="14" fill="@a" opacity=".5"/><rect x="36" y="27" width="14" height="14" fill="@a" opacity=".5"/><rect x="56" y="27" width="14" height="14" fill="@a" opacity=".5"/><rect x="76" y="27" width="14" height="14" fill="@a" opacity=".5"/><path d="M8 58h104" stroke-dasharray="3 2" stroke="#d4af37"/>',Storage:'<rect x="22" y="8" width="76" height="52" rx="6" fill="@d"/><rect x="30" y="16" width="60" height="18" rx="2" fill="@a" opacity=".35"/><path d="M40 64h40" stroke="#d4af37" stroke-width="5"/>',GPU:'<rect x="6" y="16" width="108" height="40" rx="5" fill="@d"/><circle cx="38" cy="36" r="15"/><circle cx="38" cy="36" r="4" fill="@a"/><circle cx="82" cy="36" r="15"/><circle cx="82" cy="36" r="4" fill="@a"/><path d="M6 62h60" stroke="#d4af37"/>',CPU:'<rect x="30" y="8" width="60" height="58" rx="4" fill="@d"/><rect x="42" y="20" width="36" height="34" fill="@a" opacity=".4"/><path d="M24 20h6M24 30h6M24 40h6M24 50h6M90 20h6M90 30h6M90 40h6M90 50h6" stroke="#d4af37"/>',Motherboard:'<rect x="14" y="4" width="92" height="66" rx="3" fill="@d"/><rect x="26" y="14" width="24" height="24" fill="@a" opacity=".4"/><path d="M64 12v30M72 12v30M80 12v30M88 12v30"/><rect x="26" y="50" width="68" height="6" fill="@a" opacity=".4"/>',PSU:'<rect x="18" y="12" width="84" height="48" rx="4" fill="@d"/><circle cx="46" cy="36" r="16"/><circle cx="46" cy="36" r="4" fill="@a"/><path d="M76 24h18M76 32h18M76 40h18M76 48h18"/>',Cooling:'<rect x="30" y="4" width="60" height="46" rx="3" fill="@d"/><path d="M36 4v46M44 4v46M52 4v46M60 4v46M68 4v46M76 4v46M84 4v46"/><rect x="26" y="50" width="68" height="10" rx="2" fill="@a" opacity=".5"/>',Cabinet:'<rect x="34" y="2" width="52" height="68" rx="4" fill="@d"/><rect x="40" y="8" width="40" height="38" rx="2" fill="@a" opacity=".25"/><circle cx="60" cy="27" r="12"/><circle cx="60" cy="58" r="6"/>',Peripherals:'<rect x="44" y="4" width="32" height="58" rx="16" fill="@d"/><path d="M60 4v24M44 28h32"/>'};
function art(x){var h=HUE[x.c],a="hsl("+h+",90%,62%)",d="hsl("+h+",40%,20%)";return '<svg viewBox="0 0 120 80" fill="none" stroke="'+a+'" stroke-width="2">'+B[x.c].replace(/@a/g,a).replace(/@d/g,d)+'<text x="60" y="77" font-size="7" font-weight="700" text-anchor="middle" fill="'+a+'" stroke="none">'+x.b.toUpperCase()+'</text></svg>'}
var cat="All",cart={},user=null,addr=null,step=0,method="upi",qs="";
try{cart=JSON.parse(localStorage.getItem("rz_cart")||"{}");user=JSON.parse(localStorage.getItem("rz_user")||"null")}catch(e){}
function $(i){return document.getElementById(i)}
function U(n){return Math.round(n/85)-0.01}
function inr(n){return "$"+n.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2})}
function save(){try{localStorage.setItem("rz_cart",JSON.stringify(cart));localStorage.setItem("rz_user",JSON.stringify(user))}catch(e){}}
function chips(){var cs=["All"].concat(Object.keys(ICON));$("chips").innerHTML=cs.map(function(c){return '<div class="chip'+(c==cat?' on':'')+'" onclick="cat=\''+c+'\';chips();grid()">'+c+'</div>'}).join("")}
function grid(){var L=D.filter(function(x){return(cat=="All"||x.c==cat)&&(x.n+x.b+x.c).toLowerCase().indexOf(qs)>-1});
$("grid").innerHTML=L.length?L.map(function(x){var off=Math.round((1-x.p/x.m)*100);return '<div class="card"><div class="img" style="background:linear-gradient(135deg,hsl('+HUE[x.c]+',60%,16%),hsl('+(HUE[x.c]+50)+',60%,8%))"><i>'+x.c+'</i><em>-'+off+'%</em>'+art(x)+'</div><div class="info"><div class="br">'+x.b+'</div><div class="nm">'+x.n+'</div><div class="rt">★ '+x.r+' <span>('+x.v.toLocaleString("en-IN")+')</span></div><div class="pr">'+inr(x.p)+'<s>'+inr(x.m)+'</s></div><button class="btn" onclick="add('+x.id+')">Add to cart</button></div></div>'}).join(""):'<p style="color:var(--mut)">No products found.</p>'}
$("q").oninput=function(){qs=this.value.toLowerCase();grid()};
function count(){var n=0;for(var k in cart)n+=cart[k];$("cc").textContent=n;$("acct").textContent=user?"Hi, "+user.name.split(" ")[0]:"Sign in"}
function add(i){cart[i]=(cart[i]||0)+1;save();count();openCart()}
function sub(){var s=0;for(var k in cart)s+=D[k].p*cart[k];return Math.round(s*100)/100}
function ship(){return sub()>=25||sub()==0?0:2.99}
function show(h){$("panel").innerHTML=h;$("ov").classList.add("show")}
function closeOv(){$("ov").classList.remove("show")}
function openCart(){step=0;var ks=Object.keys(cart);
if(!ks.length)return show('<h2>Your cart</h2><p style="color:var(--mut)">Your cart is empty.</p><button class="btn" onclick="closeOv()">Continue shopping</button>');
show('<h2>Your cart</h2>'+ks.map(function(k){var x=D[k];return '<div class="row"><div style="flex:1"><div class="nm">'+x.n+'</div><div class="br">'+inr(x.p)+'</div></div><div class="q"><button onclick="qty('+k+',-1)">−</button>'+cart[k]+'<button onclick="qty('+k+',1)">+</button></div></div>'}).join("")+
'<div class="tot" style="margin-top:10px"><span>Subtotal</span><span>'+inr(sub())+'</span></div><div class="tot"><span>Delivery</span><span>'+(ship()?inr(ship()):"FREE")+'</span></div><div class="tot g"><span>Total</span><span>'+inr(sub()+ship())+'</span></div><button class="btn" style="width:100%;margin-top:10px" onclick="checkout()">Proceed to checkout</button><button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeOv()">Continue shopping</button>')}
function qty(k,d){cart[k]+=d;if(cart[k]<=0)delete cart[k];save();count();openCart()}
function bar(n){return '<div class="steps">'+[0,1,2].map(function(i){return '<div class="'+(i<=n?'d':'')+'"></div>'}).join("")+'</div>'}
function openAuth(){if(user){show('<h2>My account</h2><p>'+user.name+'<br><span class="br">'+user.email+' · '+user.phone+'</span></p><button class="btn ghost" onclick="user=null;addr=null;save();count();closeOv()">Sign out</button>')}else{step=0;auth(false)}}
function auth(co){show((co?bar(0):'')+'<h2>Sign in / Sign up</h2><label>Full name</label><input class="in" id="a1"><label>Email</label><input class="in" id="a2" type="email"><label>Mobile number</label><input class="in" id="a3" type="tel" maxlength="10"><label>Password (min 6)</label><input class="in" id="a4" type="password"><div class="err" id="er"></div><button class="btn" style="width:100%" onclick="doAuth('+co+')">Continue</button>')}
function doAuth(co){var n=$("a1").value.trim(),e=$("a2").value.trim(),p=$("a3").value.trim(),w=$("a4").value;
if(n.length<2)return $("er").textContent="Enter your name.";if(!/^\S+@\S+\.\S+$/.test(e))return $("er").textContent="Enter a valid email.";if(!/^[6-9]\d{9}$/.test(p))return $("er").textContent="Enter a valid 10-digit mobile number.";if(w.length<6)return $("er").textContent="Password must be 6+ characters.";
user={name:n,email:e,phone:p};save();count();co?address():closeOv()}
function checkout(){if(!user)auth(true);else address()}
function address(){var a=addr||{};show(bar(1)+'<h2>Delivery address</h2><label>Full name</label><input class="in" id="d1" value="'+(a.n||user.name)+'"><label>Address (house no., street, area)</label><input class="in" id="d2" value="'+(a.a||"")+'"><div class="two"><div><label>City</label><input class="in" id="d3" value="'+(a.c||"")+'"></div><div><label>PIN code</label><input class="in" id="d4" maxlength="6" value="'+(a.z||"")+'"></div></div><label>State</label><input class="in" id="d5" value="'+(a.s||"")+'"><div class="err" id="er"></div><button class="btn" style="width:100%" onclick="doAddr()">Deliver to this address</button>')}
function doAddr(){var a={n:$("d1").value.trim(),a:$("d2").value.trim(),c:$("d3").value.trim(),z:$("d4").value.trim(),s:$("d5").value.trim()};
if(!a.n||a.a.length<5||!a.c||!a.s)return $("er").textContent="Please fill in all address fields.";if(!/^\d{6}$/.test(a.z))return $("er").textContent="Enter a valid 6-digit PIN code.";addr=a;payment()}
function payment(){var t=sub()+ship();show(bar(2)+'<h2>Payment</h2><div class="tot g"><span>Amount to pay</span><span>'+inr(t)+'</span></div><div class="br">Only online payment is accepted. Cash on Delivery is not available.</div><div class="pay"><button class="'+(method=="upi"?"on":"")+'" onclick="method=\'upi\';payment()">UPI</button><button class="'+(method=="card"?"on":"")+'" onclick="method=\'card\';payment()">Card</button><button class="'+(method=="nb"?"on":"")+'" onclick="method=\'nb\';payment()">Net Banking</button></div>'+
(method=="upi"?'<label>UPI ID</label><input class="in" id="p1" placeholder="yourname@upi">':method=="card"?'<label>Card number</label><input class="in" id="p1" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456"><div class="two"><div><label>Expiry (MM/YY)</label><input class="in" id="p2" maxlength="5"></div><div><label>CVV</label><input class="in" id="p3" type="password" maxlength="4"></div></div>':'<label>Select bank</label><select class="in" id="p1"><option>State Bank of India</option><option>HDFC Bank</option><option>ICICI Bank</option><option>Axis Bank</option><option>Kotak Mahindra Bank</option></select>')+
'<div class="err" id="er"></div><button class="btn" id="pb" style="width:100%" onclick="pay()">Pay '+inr(t)+' securely</button><div class="note">🔒 This is a demo checkout. To take real money, connect a payment gateway such as Razorpay or Cashfree.</div>')}
function pay(){var v=$("p1").value.trim();
if(method=="upi"&&!/^[\w.\-]{2,}@[a-zA-Z]{2,}$/.test(v))return $("er").textContent="Enter a valid UPI ID, e.g. name@upi.";
if(method=="card"){if(v.replace(/\s/g,"").length<13)return $("er").textContent="Enter a valid card number.";if(!/^(0[1-9]|1[0-2])\/\d\d$/.test($("p2").value))return $("er").textContent="Enter expiry as MM/YY.";if($("p3").value.length<3)return $("er").textContent="Enter CVV."}
$("pb").disabled=true;$("pb").textContent="Processing payment…";
setTimeout(function(){var id="RZ"+Date.now().toString().slice(-8),t=sub()+ship(),n=0;for(var k in cart)n+=cart[k];
cart={};save();count();
show('<div class="ctr"><svg class="tick" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/><path d="M28 52l16 16 29-34"/></svg><h2>Payment successful!</h2><p>Your order has been placed.</p></div><div class="note"><div class="tot"><span>Order ID</span><span>'+id+'</span></div><div class="tot"><span>Items</span><span>'+n+'</span></div><div class="tot"><span>Paid</span><span>'+inr(t)+'</span></div><div class="tot"><span>Deliver to</span><span style="text-align:right">'+addr.n+', '+addr.c+' – '+addr.z+'</span></div><div class="tot"><span>Estimated delivery</span><span>3–5 days</span></div></div><button class="btn" style="width:100%;margin-top:14px" onclick="closeOv()">Continue shopping</button>')},1800)}
chips();grid();count();
</script></body></html>
